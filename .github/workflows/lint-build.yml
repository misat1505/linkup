name: Lint & Build

on:
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: cd apps/backend && npm ci
      - run: cd apps/backend && npm run lint
      - run: cd apps/backend && npm run build

  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: cd apps/web-react && npm ci
      - run: cd apps/web-react && npm run lint
      - run: cd apps/web-react && npm run build

  next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web-next/pnpm-lock.yaml

      - run: cd apps/web-next && pnpm install
      - run: cd apps/web-next && pnpm lint
      - run: cd apps/web-next && pnpm build
